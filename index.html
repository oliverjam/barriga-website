        <style>
            * {
                box-sizing: border-box;
                margin: 0;
            }
            html {
                --accent: #f4f0e8;
                --bg: #7a2f00;
                background-color: var(--bg);
            }
            body {
                height: 100vh;
                padding-block-end: 2rem;
                color: var(--accent);
                text-align: center;
                display: flex;
                flex-direction: column;
                justify-content: center;
                font-family: "Jost", system-ui;
                font-size: clamp(1rem, 1rem + 1vw, 1.5rem);
            }
            @property --container-fill-text-captured-length {
                syntax: "<length>";
                initial-value: 0px;
                inherits: true;
            }
            h1 {
                font-family: "League Spartan";
                text-box: trim-both cap alphabetic;
                line-height: 0.84;

                --container-fill-text-captured-length: initial;
                display: flex;
                container-type: inline-size;
                > .ref {
                    visibility: hidden;
                }
                > .container {
                    flex-grow: 1;
                    container-type: inline-size;
                    --container-fill-text-captured-length: 100cqi;
                    --available-space: var(
                        --container-fill-text-captured-length
                    );
                    > span {
                        --container-fill-text-captured-length: 100cqi;
                        --ratio: tan(
                            atan2(
                                var(--available-space),
                                var(--available-space) -
                                    var(--container-fill-text-captured-length)
                            )
                        );
                        display: block;
                        inline-size: var(--available-space);
                        font-size: clamp(
                            2rem,
                            1em * var(--ratio),
                            infinity * 1px
                        );
                    }
                }
            }
            svg {
                margin-block-start: 2rem;
                margin-block-end: 1rem;
                inline-size: 100%;
                max-inline-size: 30rem;
                height: auto;
                display: block;
                margin-inline: auto;
            }
            time {
                margin-block-start: 1rem;
            }
            a {
                color: inherit;
                text-decoration-line: none;
                font-size: 1rem;
                &:hover {
                    text-decoration-line: underline;
                }
            }
            .book {
                margin-block-start: 2rem;
                text-decoration-line: underline;
                text-decoration-thickness: 2px;
            }
            time,
            .book {
                font-family: "Just Another Hand";
                font-size: clamp(1.5rem, 1.5rem + 1vw, 4rem);
                text-transform: uppercase;
                letter-spacing: 4px;
            }
            .insta {
                position: fixed;
                bottom: 1rem;
                right: 1rem;
                display: flex;
                gap: 0.5ch;
                align-items: center;
            }
        </style>
    </head>
